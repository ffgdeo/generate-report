bundle:
  name: deck-export-demo

variables:
  warehouse_id:
    default: 7061d004ec1f1f1e

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://fevm-fd-fevm-classic.cloud.databricks.com

resources:
  jobs:
    deck_job:
      name: deck-export-demo-build-deck
      max_concurrent_runs: 10
      parameters:
        - { name: customer_ids, default: "" }
        - { name: regions, default: "" }
        - { name: months, default: "" }
        - { name: exclude_pending, default: "false" }
        - { name: requested_by, default: "unknown" }
        - { name: output_path, default: "" }
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - python-pptx
      tasks:
        - task_key: build_deck
          environment_key: default
          spark_python_task:
            python_file: src/build_deck.py
            parameters:
              - --customer-ids
              - "{{job.parameters.customer_ids}}"
              - --regions
              - "{{job.parameters.regions}}"
              - --months
              - "{{job.parameters.months}}"
              - --exclude-pending
              - "{{job.parameters.exclude_pending}}"
              - --requested-by
              - "{{job.parameters.requested_by}}"
              - --output-path
              - "{{job.parameters.output_path}}"

  apps:
    deck_app:
      name: deck-export-demo
      description: Generate editable PPTX performance decks from Unity Catalog data
      source_code_path: ./app
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: deck-job
          job:
            id: ${resources.jobs.deck_job.id}
            permission: CAN_MANAGE_RUN
        - name: export-volume
          uc_securable:
            securable_full_name: fd_fevm_classic_catalog.deck_demo.exports
            securable_type: VOLUME
            permission: WRITE_VOLUME
